# Production stack for Coolify (Docker Compose build pack).
#
# Coolify injects the values for ${VARIABLES} from the application's
# Environment Variables screen. SERVICE_* variables are generated by Coolify.
#
# Public routing:
#   frontend -> https://app.rewardsynchq.com  (container port 3000)
#   backend  -> https://api.rewardsynchq.com  (container port 8000)
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealverse}
      POSTGRES_USER: ${POSTGRES_USER:-dealverse}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SERVICE_BASE64_64_DJANGOSECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-dealverse}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-dealverse}
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SERVE_MEDIA: ${SERVE_MEDIA:-True}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}
      IMPACT_API_TOKEN: ${IMPACT_API_TOKEN}
      IMPACT_ACCOUNT_SID: ${IMPACT_ACCOUNT_SID}
      AFFILIATE_WEBHOOK_SECRET: ${AFFILIATE_WEBHOOK_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-120}
      SERVICE_URL_BACKEND_8000: /
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  celery:
    build:
      context: ./backend
    command: ["celery-worker"]
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SERVICE_BASE64_64_DJANGOSECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-dealverse}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-dealverse}
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}
      IMPACT_API_TOKEN: ${IMPACT_API_TOKEN}
      IMPACT_ACCOUNT_SID: ${IMPACT_ACCOUNT_SID}
      AFFILIATE_WEBHOOK_SECRET: ${AFFILIATE_WEBHOOK_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
    command: ["celery-beat"]
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SERVICE_BASE64_64_DJANGOSECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-dealverse}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-dealverse}
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}
      AFFILIATE_WEBHOOK_SECRET: ${AFFILIATE_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    environment:
      NEXTAUTH_SECRET: ${SERVICE_BASE64_64_NEXTAUTHSECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_SECRET: ${SERVICE_BASE64_64_NEXTAUTHSECRET}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # Server-side calls stay inside the Compose network.
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000/server}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}
      SERVICE_URL_FRONTEND_3000: /
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
